[package]
name = "sparkgauge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Desktop system monitor for NVIDIA GB10 machines (DGX Spark and friends) that shows the GPU and splits the unified memory between GPU and CPU"
authors = ["kooh16"]
repository = "https://github.com/kooh16/sparkgauge"
license = "MIT"
readme = "README.md"
keywords = ["gpu", "monitor", "nvml", "gb10", "egui"]
categories = ["command-line-utilities", "visualization"]
exclude = ["docs/"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
nvml-wrapper = "0.13"
resvg = "0.45"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
